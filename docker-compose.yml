version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: iemp-postgres
    restart: always
    environment:
      POSTGRES_USER: iemp_user
      POSTGRES_PASSWORD: iemp_password
      POSTGRES_DB: iemp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iemp-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://iemp_user:iemp_password@db:5432/iemp_db
      USE_MOCK_AWS: "true"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iemp-web
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
